schema_version: 1

context:
  name: gsffile
  version: "0.5.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gsffile-${{ version }}.tar.gz
  sha256: 2ef6dbd911679fead6b2be8addb0f9c72e8fc2888da26e56e4c815a509fbda78

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.26
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.24

tests:
  - python:
      imports:
        - gsffile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Read and write Gwyddion Simple Field files
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/angelo-peronio/gsffile

extra:
  recipe-maintainers:
    - carlodri
    - angelo-peronio
